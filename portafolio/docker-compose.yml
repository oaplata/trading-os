version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: portafolio_db
    environment:
      POSTGRES_USER: portafolio
      POSTGRES_PASSWORD: portafolio123
      POSTGRES_DB: portafolio_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portafolio"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: portafolio_backend
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://portafolio:portafolio123@postgres:5432/portafolio_db
      PORT: 3000
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    command: npm run dev

volumes:
  postgres_data:

